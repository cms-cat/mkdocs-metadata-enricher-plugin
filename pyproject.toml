[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mkdocs-metadata-enricher-plugin"
description = "MkDocs plugin for enriching sitemap.xml and search index with git revision dates"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "mkdocs-metadata-enricher contributors"}
]
keywords = ["mkdocs", "plugin", "sitemap", "search", "git", "metadata"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Plugins",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
]
dynamic = ["version"]

dependencies = [
    "mkdocs>=1.0",
    "mkdocs-git-revision-date-localized-plugin>=0.14.0",
    "babel>=2.12.0",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.5.0",
    "prek>=0.3.0",
    "ty>=0.0.1a1",
]

[project.entry-points."mkdocs.plugins"]
metadata-enricher = "mkdocs_metadata_enricher_plugin.plugin:MetadataEnricherPlugin"

[tool.hatch.version]
path = "src/mkdocs_metadata_enricher_plugin/__init__.py"
pattern = '__version__ = "(?P<version>[^"]+)"'

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["mkdocs_metadata_enricher_plugin"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
python_classes = "Test*"
addopts = "-v --strict-markers --cov=src/mkdocs_metadata_enricher_plugin --cov-report=term-missing"
minversion = "7.0"
markers = [
    "unit: unit tests",
    "integration: integration tests requiring mkdocs build",
]

[project.urls]
Documentation = "https://cms-cat.github.io/mkdocs-metadata-enricher-plugin/"
Changelog = "https://github.com/cms-cat/mkdocs-metadata-enricher-plugin/blob/main/CHANGELOG.md"
Homepage = "https://github.com/cms-cat/mkdocs-metadata-enricher-plugin"
Issues = "https://github.com/cms-cat/mkdocs-metadata-enricher-plugin/issues"
Repository = "https://github.com/cms-cat/mkdocs-metadata-enricher-plugin"

[dependency-groups]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocs-git-revision-date-localized-plugin>=1.2",
]
