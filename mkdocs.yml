site_name: mkdocs-metadata-enricher-plugin
site_description: MkDocs plugin that enriches sitemap.xml and search index with git revision dates
site_url: https://cms-cat.github.io/mkdocs-metadata-enricher-plugin/
repo_url: https://github.com/cms-cat/mkdocs-metadata-enricher-plugin
repo_name: cms-cat/mkdocs-metadata-enricher-plugin

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.path
    - navigation.breadcrumbs
    - content.code.copy
    - content.code.annotate
    - search.highlight
    - search.suggest
    - search.share
  icon:
    logo: material/metadata
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/cms-cat/mkdocs-metadata-enricher-plugin
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/mkdocs-metadata-enricher-plugin/

plugins:
  - search
  - git-revision-date-localized:
      type: date
      enable_creation_date: false
  - metadata-enricher:
      enrich_sitemap: true
      enrich_search: true
      search_date_type: datetime
      search_locale: en

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Configuration: configuration.md
  - How It Works: how-it-works.md
  - Development: development.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:pymdownx.emoji.twemoji
      emoji_generator: !!python/name:pymdownx.emoji.to_svg
  - attr_list
  - toc:
      permalink: true
      baselevel: 2
